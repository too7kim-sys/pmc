# PMC Agent 설치용 설정 (장애예방점검 자동화)
# 운영 환경에 맞게 수정하세요. 환경변수 오버라이드: PMC_SERVER_URL, PMC_API_KEY, PMC_AGENT_ID

# 점검 서버 베이스 URL (필수)
serverUrl: http://pmc-server.example.go.kr:8080

# 최초 등록용 1회 토큰 (웹 UI 에서 대상 서버 등록 시 발급) — 등록 후 비워도 됨
enrollToken: ""

# 등록 성공 후 자동 기록됨 (수동 입력 불필요)
# agentId: ""
# apiKey: ""

# 호스트 식별 (비우면 자동 탐지)
# hostname: ""
# ipAddr: ""
# osType: ""

# 수집 카테고리 (전체 7종)
categories:
  - OS
  - WEB
  - WAS
  - DB
  - SW
  - NW
  - SVC

# 스케줄: scheduleCron(매일 HH:mm) 우선, 없으면 intervalSeconds 인터벌
#   "0 0 6 * * *" → 매일 06:00
scheduleCron: "0 0 6 * * *"
intervalSeconds: 300

# heartbeat 주기(초)
heartbeatSeconds: 60

# 명령/HTTP 기본 타임아웃(ms)
timeoutMs: 10000

# 미전송 결과 스풀 디렉토리
spoolDir: /opt/pmc-agent/spool

# 로그 레벨
logLevel: INFO
