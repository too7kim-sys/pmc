# PMC Server 전역 설정 (eGovFrame globals.properties 관례)
# DB (PostgreSQL)
Globals.DbType=postgresql
Globals.DriverClassName=org.postgresql.Driver
Globals.Url=jdbc:postgresql://localhost:5432/pmc
Globals.UserName=pmc
Globals.Password=pmc

# 보고서 산출물 저장 경로
Globals.ReportDir=/tmp/pmc-reports

# Agent 등록 토큰 유효시간(분)
Globals.EnrollTokenTtlMin=60
