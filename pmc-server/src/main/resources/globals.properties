# PMC Server 전역 설정 (eGovFrame globals.properties 관례)
# DB (PostgreSQL)
Globals.DbType=postgresql
Globals.DriverClassName=org.postgresql.Driver
Globals.Url=jdbc:postgresql://localhost:5432/pmc
Globals.UserName=pmc
Globals.Password=pmc

# 보고서 산출물 저장 경로
Globals.ReportDir=/tmp/pmc-reports

# Agent 등록 토큰 유효시간(분)
Globals.EnrollTokenTtlMin=60

# 이상 알림(Webhook) — 기본 비활성. URL 설정 + Enabled=true 시 동작
Globals.AlertEnabled=false
Globals.AlertWebhookUrl=
Globals.AlertDedupeMin=30

# 데이터 보존(일) — 0 이하면 해당 정리 생략. 계획 연계 run 은 보존
Globals.RetentionRunDays=90
Globals.RetentionReportDays=180
Globals.RetentionAlertDays=90

# 정기 보고서 자동 생성 — 기본 비활성
Globals.AutoReportEnabled=false
Globals.AutoReportType=PDF
Globals.AutoReportDays=7

# 취약점 진단/재발방지 — 신규 취약점(VULN_NEW) 알림은 기본 비활성(노이즈 억제).
# 재발(VULN_RECUR) 알림은 항상 동작(AlertService 가용성/중복억제 가드 적용).
Globals.VulnNewAlertEnabled=false

# 보안 — 로그인 실패 N회 누적 시 계정 잠금(관리자가 사용자관리에서 해제). 0 이하면 잠금 비활성.
Globals.LoginFailLockCnt=5
